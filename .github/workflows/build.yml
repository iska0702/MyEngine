
name: MyEngine Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Update repository
        shell: powershell
        run: |
          git -C D:\MyEngine fetch origin
          git -C D:\MyEngine checkout $env:GITHUB_REF_NAME
          git -C D:\MyEngine pull origin $env:GITHUB_REF_NAME

      - name: Build Editor
        shell: cmd
        run: |
          cd /d D:\MyEngine
          call build.bat editor standalone
          if errorlevel 1 exit /b 1

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: MyEngine-Editor-Windows
          path: D:\MyEngine\EditorBuild\Idontknow.exe
          if-no-files-found: error
