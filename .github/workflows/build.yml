
name: MyEngine Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Locate Visual Studio
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          if (!(Test-Path $vswhere)) {
            throw "vswhere.exe not found"
          }

          $vs = & $vswhere -latest -products '*' -property installationPath

          if (!$vs) {
            throw "Visual Studio not found"
          }

          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvarsall.bat"

          if (!(Test-Path $vcvars)) {
            throw "vcvarsall.bat not found: $vcvars"
          }

          "VCVARS=$vcvars" >> $env:GITHUB_ENV
          Write-Host "Visual Studio: $vs"

      - name: Prepare build environment
        shell: cmd
        run: |
          call "%VCVARS%" x64
          if errorlevel 1 exit /b 1
          cl.exe /?
          if errorlevel 1 exit /b 1

      - name: Build Editor
        shell: cmd
        run: |
          call build.bat editor standalone
          if errorlevel 1 exit /b 1

      - name: Upload Editor
        uses: actions/upload-artifact@v4
        with:
          name: MyEngine-Editor-Windows
          path: EditorBuild/Idontknow.exe
          if-no-files-found: error
